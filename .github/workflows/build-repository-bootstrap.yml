name: Build Repository Bootstrap

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RepositoryBootstrap/**'
      - '.github/workflows/build-repository-bootstrap.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RepositoryBootstrap/Jellyfin.Plugin.RepositoryBootstrap.csproj

      - name: Publish
        run: dotnet publish RepositoryBootstrap/Jellyfin.Plugin.RepositoryBootstrap.csproj -c Release -o publish/bootstrap --no-restore

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Jellyfin.Plugin.RepositoryBootstrap_0.1.0 | Out-Null
          Copy-Item publish/bootstrap/Jellyfin.Plugin.RepositoryBootstrap.dll dist/Jellyfin.Plugin.RepositoryBootstrap_0.1.0/
          Compress-Archive -Path dist/Jellyfin.Plugin.RepositoryBootstrap_0.1.0/* -DestinationPath dist/Jellyfin.Plugin.RepositoryBootstrap_0.1.0.zip -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.RepositoryBootstrap_0.1.0
          path: dist/Jellyfin.Plugin.RepositoryBootstrap_0.1.0.zip

      - name: Publish stable Bootstrap ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path repository | Out-Null
          Copy-Item dist/Jellyfin.Plugin.RepositoryBootstrap_0.1.0.zip repository/Jellyfin.Plugin.RepositoryBootstrap_0.1.0.zip -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f repository/Jellyfin.Plugin.RepositoryBootstrap_0.1.0.zip

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Bootstrap package is already current."
            exit 0
          }

          git commit -m "Publish Repository Bootstrap package [skip ci]"
          git push
