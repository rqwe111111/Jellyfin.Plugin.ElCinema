name: Build Jellyfin.Plugin.ElCinema

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Reconstruct large source files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Services | Out-Null
          $client = (Get-ChildItem Services/_source/ElCinemaClient.cs.b64.* | Sort-Object Name | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('Services/ElCinemaClient.cs', [Convert]::FromBase64String($client))
          $html = (Get-ChildItem Services/_source/HtmlTools.cs.b64.* | Sort-Object Name | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('Services/HtmlTools.cs', [Convert]::FromBase64String($html))
          Write-Host "ElCinemaClient.cs: $((Get-Item Services/ElCinemaClient.cs).Length) bytes"
          Write-Host "HtmlTools.cs: $((Get-Item Services/HtmlTools.cs).Length) bytes"
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.ElCinema.csproj
      - name: Publish
        run: dotnet publish Jellyfin.Plugin.ElCinema.csproj -c Release -o publish --no-restore
      - name: Prepare plugin folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Jellyfin.Plugin.ElCinema_0.3.0 | Out-Null
          Copy-Item publish/Jellyfin.Plugin.ElCinema.dll dist/Jellyfin.Plugin.ElCinema_0.3.0/
          Get-ChildItem publish -Filter '*.dll' | Where-Object {
            $_.Name -notlike 'Jellyfin.*' -and
            $_.Name -notlike 'MediaBrowser.*' -and
            $_.Name -notlike 'Microsoft.*' -and
            $_.Name -notlike 'System.*' -and
            $_.Name -ne 'Jellyfin.Plugin.ElCinema.dll'
          } | Copy-Item -Destination dist/Jellyfin.Plugin.ElCinema_0.3.0/
          Compress-Archive -Path dist/Jellyfin.Plugin.ElCinema_0.3.0/* -DestinationPath dist/Jellyfin.Plugin.ElCinema_0.3.0.zip -Force
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.ElCinema_0.3.0
          path: dist/Jellyfin.Plugin.ElCinema_0.3.0.zip
