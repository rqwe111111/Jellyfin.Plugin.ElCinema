name: Build Jellyfin.Plugin.ElCinema

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'RepositoryBootstrap/**'
      - '.github/workflows/build-repository-bootstrap.yml'
      - 'repository/**'
      - 'manifest.json'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Reconstruct large source files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Services | Out-Null
          $client = (Get-ChildItem Services/_source/ElCinemaClient.cs.b64.* | Sort-Object Name | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('Services/ElCinemaClient.cs', [Convert]::FromBase64String($client))
          $html = (Get-ChildItem Services/_source/HtmlTools.cs.b64.* | Sort-Object Name | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('Services/HtmlTools.cs', [Convert]::FromBase64String($html))
          $htmlPath = 'Services/HtmlTools.cs'
          $source = Get-Content $htmlPath -Raw
          $source = $source -replace 'private static void AddGenre\(ElCinemaWork w,string\? s\)\{[^\r\n]*\}', 'private static void AddGenre(ElCinemaWork w,string? s){if(string.IsNullOrWhiteSpace(s))return;var v=s.Trim();if(!w.Genres.Any(x=>string.Equals(x,v,StringComparison.OrdinalIgnoreCase)))w.Genres.Add(v);}'
          $source = $source.Replace('string.Equals(x.Name,p.Name,StringComparer.OrdinalIgnoreCase)', 'string.Equals(x.Name,p.Name,StringComparison.OrdinalIgnoreCase)')
          Set-Content -Path $htmlPath -Value $source -Encoding utf8
          Write-Host "ElCinemaClient.cs: $((Get-Item Services/ElCinemaClient.cs).Length) bytes"
          Write-Host "HtmlTools.cs: $((Get-Item Services/HtmlTools.cs).Length) bytes"
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.ElCinema.csproj
      - name: Publish
        run: dotnet publish Jellyfin.Plugin.ElCinema.csproj -c Release -o publish --no-restore
      - name: Prepare plugin folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Jellyfin.Plugin.ElCinema_0.3.0 | Out-Null
          Copy-Item publish/Jellyfin.Plugin.ElCinema.dll dist/Jellyfin.Plugin.ElCinema_0.3.0/
          Get-ChildItem publish -Filter '*.dll' | Where-Object {
            $_.Name -notlike 'Jellyfin.*' -and
            $_.Name -notlike 'MediaBrowser.*' -and
            $_.Name -notlike 'Microsoft.*' -and
            $_.Name -notlike 'System.*' -and
            $_.Name -ne 'Jellyfin.Plugin.ElCinema.dll'
          } | Copy-Item -Destination dist/Jellyfin.Plugin.ElCinema_0.3.0/
          Compress-Archive -Path dist/Jellyfin.Plugin.ElCinema_0.3.0/* -DestinationPath dist/Jellyfin.Plugin.ElCinema_0.3.0.zip -Force
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.ElCinema_0.3.0
          path: dist/Jellyfin.Plugin.ElCinema_0.3.0.zip

      - name: Publish Jellyfin repository manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path repository | Out-Null
          Copy-Item dist/Jellyfin.Plugin.ElCinema_0.3.0.zip repository/Jellyfin.Plugin.ElCinema_0.3.0.zip -Force

          $zip = 'repository/Jellyfin.Plugin.ElCinema_0.3.0.zip'
          $checksum = (Get-FileHash $zip -Algorithm MD5).Hash.ToLowerInvariant()
          $timestamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss')

          $manifest = @"
          [
            {
              "category": "Metadata",
              "guid": "2af4cef6-0133-4519-8e31-18ffadeaeb41",
              "name": "elCinema Metadata Full",
              "description": "Arabic movie, series, season, episode and people metadata provider for Jellyfin 12.1.",
              "owner": "Rafat",
              "overview": "Arabic metadata from elCinema for Jellyfin",
              "versions": [
                {
                  "checksum": "$checksum",
                  "changelog": "Full beta with movies, series, seasons, episodes, people and images.",
                  "targetAbi": "12.0.0.0",
                  "sourceUrl": "https://raw.githubusercontent.com/rqwe111111/Jellyfin.Plugin.ElCinema/main/repository/Jellyfin.Plugin.ElCinema_0.3.0.zip",
                  "timestamp": "$timestamp",
                  "version": "0.3.0.0"
                }
              ]
            }
          ]
          "@

          $manifest | Set-Content manifest.json -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f repository/Jellyfin.Plugin.ElCinema_0.3.0.zip manifest.json

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Repository package is already current."
            exit 0
          }

          git commit -m "Publish Jellyfin repository package [skip ci]"
          git push
